# Every push and pull request is tested in a clean Arch Linux container. When a push to main
# passes, the tag "stable" — what every installed machine pulls — moves to it, so an untested
# or broken version never reaches the machines.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git python python-pexpect python-pyte shellcheck nodejs
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: shellcheck install.sh bin/arch-update-launcher bin/arch-update-cactus-sync lib/demo-update
      - name: No unfilled placeholders
        run: "! grep -n '@REPO@' install.sh README.md"
      - name: Self-test
        run: ./install.sh --check
      - name: Relay tests
        run: node --test relay/test.mjs
      - name: Engine tests and headless runs at laptop and desktop terminal sizes
        run: |
          useradd -m tester
          chown -R tester: .
          su tester -c 'python3 tests/test_engine.py && python3 tests/test_fixes.py && python3 tests/test_report.py && python3 tests/test_sync.py && python3 tests/run.py'

  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the stable tag to the tested commit
        run: |
          # Where is the tag now? ls-remote exits 2 when it does not exist yet, else on any error.
          if cur=$(git ls-remote --exit-code origin refs/tags/stable); then
            cur=${cur%%[[:space:]]*}
            git fetch -q origin refs/tags/stable
            if git merge-base --is-ancestor "$GITHUB_SHA" "$cur"; then
              echo "stable already contains this commit (a newer push was promoted first)"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$cur" "$GITHUB_SHA"; then
              echo "::error::main and stable have diverged (was main force-pushed?); the machines stay on stable"
              exit 1
            fi
          elif [ $? -ne 2 ]; then
            echo "::error::could not read the stable tag; not moving it"
            exit 1
          else
            cur=
          fi
          # A tag moves only by force; the lease makes it a compare-and-swap on the server.
          git push --force-with-lease="refs/tags/stable:$cur" origin "$GITHUB_SHA:refs/tags/stable"
